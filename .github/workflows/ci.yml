name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Must precede setup-node: `cache: pnpm` needs the store path, and only
      # this action knows it. Version comes from the `packageManager` field.
      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # postinstall runs `prisma generate`, so the client exists before tsc.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm turbo run test

  migrations:
    name: Migration status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fork pull requests never receive secrets, and the secret may not be set
      # yet. Warn loudly rather than failing every PR red or passing silently —
      # a skipped drift check that looks green is the thing this job exists to
      # prevent.
      - name: Is the check armed?
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning title=Migration check skipped::DATABASE_URL is not set for this run, so schema drift was NOT checked. Set the repository secret (point it at a Neon branch, not production) to arm this job."
            echo "armed=false" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
          fi

      # Exits non-zero on a migration that exists in the repo but never ran, and
      # on one recorded as failed. This is the half `/api/health` cannot see:
      # the migrations directory is not in the serverless bundle, so the running
      # app has no repo to compare the database against. Previews skip
      # `migrate:deploy` on purpose (they share the production database), so CI
      # is the only place a pending migration surfaces before the production
      # build tries to apply it.
      - name: prisma migrate status
        if: steps.guard.outputs.armed == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate:status
